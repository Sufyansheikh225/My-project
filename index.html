<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do List App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <div class="todo-app">
            <h2>Meri To-Do List <i class="fa-solid fa-list-check"></i></h2>
            <div class="row">
                <input type="text" id="input-box" placeholder="Naya kaam yahan likhein...">
                <button onclick="addTask()">Add Karein</button>
            </div>
            <ul id="list-container">
                <!-- Tasks yahan JavaScript ke zariye ayenge -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
